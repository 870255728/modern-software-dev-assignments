<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modern Software Dev Starter</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Modern Software Dev Starter</h1>

      <section>
        <h2>Notes</h2>
        <form id="note-form">
          <input id="note-title" placeholder="Title" maxlength="200" required />
          <input id="note-content" placeholder="Content" maxlength="10000" required />
          <button type="submit">Add</button>
        </form>
        <p id="notes-error" class="error" role="alert" hidden></p>
        <ul id="notes"></ul>
      </section>

      <section>
        <h2>Action Items</h2>
        <form id="action-form">
          <input id="action-desc" placeholder="Description" required />
          <button type="submit">Add</button>
        </form>
        <div class="action-toolbar" aria-label="Action item controls">
          <div id="action-filters" class="filters" aria-label="Filter action items">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="open" aria-pressed="false">Open</button>
            <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button type="button" id="bulk-complete" disabled>Complete selected</button>
        </div>
        <p id="action-status" class="status" role="status" aria-live="polite"></p>
        <ul id="actions"></ul>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
